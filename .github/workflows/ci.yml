name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run fixtures
        working-directory: web
      - run: npm run course-classes
        working-directory: web
      - run: git diff --exit-code
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run build:single
        working-directory: web
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew build -x :reflection-lab:test
        working-directory: playground
      - run: ./gradlew :reflection-lab:test -Plab=solution
        working-directory: playground
      - run: ./gradlew :reflection-lab:compileJava
        working-directory: playground
      - run: ./gradlew :porter:run --args=all
        working-directory: playground
